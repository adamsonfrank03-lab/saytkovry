<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Примерка Ковров | Luxury Carpets</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .results-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .result-item {
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        .result-item.active {
            border-color: var(--accent);
        }
        .result-item img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Виртуальная примерочная</h1>
            <p>Загрузите фото вашей комнаты и ИИ предложит 3 варианта размещения ковра</p>
        </header>

        <section class="ai-section">
            <div class="upload-container">
                <h3>1. Загрузите интерьер</h3>
                <div class="upload-zone" id="drop-zone">
                    <div class="upload-icon">📸</div>
                    <p>Нажмите для загрузки фото</p>
                    <input type="file" id="file-input" style="display: none;" accept="image/*">
                </div>
            </div>

            <div class="result-container">
                <h3>2. Результат AI-примерки</h3>
                <div class="preview-area" id="preview-area">
                    <div style="padding: 2rem; text-align: center; color: #999; margin-top: 5rem;">
                        Здесь появятся варианты после выбора ковра
                    </div>
                </div>
                <div class="loader" id="loader"></div>
                <div class="results-grid" id="results-thumbnails"></div>
            </div>
        </section>

        <section class="carpet-selection">
            <h3>3. Выберите коллекцию</h3>
            <div class="carpet-grid">
                <div class="carpet-card" onclick="tryCarpet('classic_set', 'Классическая коллекция')">
                    <img src="https://images.unsplash.com/photo-1576020488411-2da6e212fa4b?q=80&w=200" alt="Carpet 1">
                    <div class="carpet-info">Классика</div>
                </div>
                <div class="carpet-card" onclick="tryCarpet('modern_set', 'Современная коллекция')">
                    <img src="https://images.unsplash.com/photo-1534889156217-d3c8ef81f343?q=80&w=200" alt="Carpet 2">
                    <div class="carpet-info">Модерн</div>
                </div>
                <div class="carpet-card" onclick="tryCarpet('silk_set', 'Шелковая коллекция')">
                    <img src="https://images.unsplash.com/photo-1594051808233-e00df58e701e?q=80&w=200" alt="Carpet 3">
                    <div class="carpet-info">Шелк</div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const previewArea = document.getElementById('preview-area');
        const loader = document.getElementById('loader');
        const thumbsContainer = document.getElementById('results-thumbnails');
        let selectedFile = null;

        dropZone.onclick = () => fileInput.click();

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = (event) => {
                    dropZone.innerHTML = `<img src="${event.target.result}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;">`;
                };
                reader.readAsDataURL(file);
            }
        };

        async function tryCarpet(carpetId, carpetName) {
            if (!selectedFile) {
                alert('Пожалуйста, сначала загрузите фото комнаты');
                return;
            }

            loader.style.display = 'block';
            thumbsContainer.innerHTML = '';

            const formData = new FormData();
            formData.append('room_image', selectedFile);
            formData.append('carpet_id', carpetId);

            try {
                const response = await fetch('http://localhost:5000/api/process-carpet', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.status === 'success') {
                    displayResults(result.variations);
                }
            } catch (error) {
                console.error("API Error:", error);
                // Fallback для демонстрации
                displayResults([
                    {url: 'https://images.unsplash.com/photo-1576020488411-2da6e212fa4b?q=80&w=800', desc: 'Вариант 1'},
                    {url: 'https://images.unsplash.com/photo-1534889156217-d3c8ef81f343?q=80&w=800', desc: 'Вариант 2'},
                    {url: 'https://images.unsplash.com/photo-1594051808233-e00df58e701e?q=80&w=800', desc: 'Вариант 3'}
                ]);
            } finally {
                loader.style.display = 'none';
            }
        }

        function displayResults(variations) {
            thumbsContainer.innerHTML = '';
            variations.forEach((v, index) => {
                const thumb = document.createElement('div');
                thumb.className = 'result-item' + (index === 0 ? ' active' : '');
                thumb.innerHTML = `<img src="${v.url}" alt="${v.desc}">`;
                thumb.onclick = () => {
                    document.querySelectorAll('.result-item').forEach(el => el.classList.remove('active'));
                    thumb.classList.add('active');
                    updateMainPreview(v.url, v.desc);
                };
                thumbsContainer.appendChild(thumb);
            });

            if (variations.length > 0) {
                updateMainPreview(variations[0].url, variations[0].desc);
            }
        }

        function updateMainPreview(url, desc) {
            previewArea.innerHTML = `
                <div style="position: relative; width: 100%; height: 100%;">
                    <img src="${url}" style="width: 100%; height: 100%; object-fit: cover;">
                    <div style="position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); color: white; padding: 5px 12px; border-radius: 4px; font-size: 12px;">
                        ${desc}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
