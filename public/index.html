<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Carpet Fitting | Luxury Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="luxury-app">
        <aside class="sidebar">
            <div class="logo">
                <h2>RUG<span>AI</span></h2>
            </div>

            <section class="control-panel">
                <div class="step">
                    <h3>1. Ваш интерьер</h3>
                    <label for="room-upload" class="upload-btn">
                        <span class="icon">📷</span> Загрузить фото комнаты
                    </label>
                    <input type="file" id="room-upload" accept="image/*" hidden>
                </div>

                <div class="step">
                    <h3>2. Выберите ковер</h3>
                    <div class="carpet-selection">
                        <div class="carpet-item active" data-src="assets/carpet1.jpg">
                            <img src="assets/carpet1.jpg" alt="Carpet 1">
                            <span>Классика</span>
                        </div>
                        <div class="carpet-item" data-src="assets/carpet2.jpg">
                            <img src="assets/carpet2.jpg" alt="Carpet 2">
                            <span>Модерн</span>
                        </div>
                        <div class="carpet-item" data-src="assets/carpet3.jpg">
                            <img src="assets/carpet3.jpg" alt="Carpet 3">
                            <span>Премиум</span>
                        </div>
                    </div>
                </div>

                <div class="step">
                    <h3>3. Тонкая настройка</h3>
                    <div class="slider-group">
                        <label>Перспектива</label>
                        <input type="range" id="persp" min="0" max="85" value="60">
                    </div>
                    <div class="slider-group">
                        <label>Размер</label>
                        <input type="range" id="scale" min="0.1" max="2" step="0.01" value="0.8">
                    </div>
                    <div class="slider-group">
                        <label>Положение Y</label>
                        <input type="range" id="posY" min="0" max="100" value="65">
                    </div>
                    <div class="slider-group">
                        <label>Положение X</label>
                        <input type="range" id="posX" min="0" max="100" value="50">
                    </div>
                </div>

                <button id="ai-enhance" class="ai-btn">Улучшить через ИИ ✨</button>
            </section>
        </aside>

        <main class="viewport">
            <div class="canvas-container" id="canvas-container">
                <!-- Фон комнаты -->
                <img id="room-bg" src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?q=80&w=1200" alt="Room">

                <!-- Контейнер для ковра с перспективой -->
                <div class="carpet-perspective-wrapper">
                    <img id="carpet-overlay" src="assets/carpet1.jpg" alt="Carpet Overlay">
                </div>

                <div id="loading-overlay" class="loading-overlay">
                    <div class="spinner"></div>
                    <p>AI обрабатывает изображение...</p>
                </div>
            </div>

            <div class="viewport-footer">
                <p>Интерактивный режим: Перетаскивайте ползунки для идеального расположения</p>
            </div>
        </main>
    </div>

    <script>
        const roomUpload = document.getElementById('room-upload');
        const roomBg = document.getElementById('room-bg');
        const carpetOverlay = document.getElementById('carpet-overlay');
        const carpetItems = document.querySelectorAll('.carpet-item');

        // Controls
        const perspSlider = document.getElementById('persp');
        const scaleSlider = document.getElementById('scale');
        const posYSlider = document.getElementById('posY');
        const posXSlider = document.getElementById('posX');
        const aiBtn = document.getElementById('ai-enhance');
        const loader = document.getElementById('loading-overlay');

        // Update Transform
        function updateTransform() {
            const p = perspSlider.value;
            const s = scaleSlider.value;
            const y = posYSlider.value;
            const x = posXSlider.value;

            // Применяем перспективу к обертке
            const wrapper = document.querySelector('.carpet-perspective-wrapper');
            wrapper.style.top = `${y}%`;
            wrapper.style.left = `${x}%`;

            // Применяем 3D поворот к самому ковру
            carpetOverlay.style.transform = `translate(-50%, -50%) perspective(1000px) rotateX(${p}deg) scale(${s})`;
        }

        [perspSlider, scaleSlider, posYSlider, posXSlider].forEach(s => {
            s.addEventListener('input', updateTransform);
        });

        // Room Upload
        roomUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (f) => {
                    roomBg.src = f.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Carpet Selection
        carpetItems.forEach(item => {
            item.addEventListener('click', () => {
                carpetItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                carpetOverlay.src = item.dataset.src;
            });
        });

        // AI "Enhance" Simulation
        aiBtn.addEventListener('click', async () => {
            loader.classList.add('visible');

            // Имитация работы бекенда
            setTimeout(() => {
                loader.classList.remove('visible');
                alert("AI-улучшение завершено! В реальной версии здесь будет результат глубокого вписывания ковра в текстуру пола.");
            }, 2500);
        });

        // Initial
        updateTransform();
    </script>
</body>
</html>
